name: trayvi-local

services:
  postgres:
    build:
      context: ../database
      dockerfile: Dockerfile.postgis
    image: trayvi/postgis:17-3.5-alpine-hardened
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRAYVI_DB_NAME:?TRAYVI_DB_NAME is required}
      POSTGRES_USER: ${TRAYVI_DB_ADMIN_USER:?TRAYVI_DB_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${TRAYVI_DB_ADMIN_PASSWORD:?TRAYVI_DB_ADMIN_PASSWORD is required}
      TRAYVI_DB_RUNTIME_PASSWORD: ${TRAYVI_DB_RUNTIME_PASSWORD:?TRAYVI_DB_RUNTIME_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: UTC
    ports:
      - '127.0.0.1:${TRAYVI_DB_PORT:-54329}:5432'
    volumes:
      - trayvi_postgres_data:/var/lib/postgresql/data
      - ../database/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 2

volumes:
  trayvi_postgres_data:
